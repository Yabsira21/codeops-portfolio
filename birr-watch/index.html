<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birr Watch</title>
    <!-- <link rel="stylesheet" href="styles.css"> -->
</head>

<body>

    <main class="container">
        <header>
            <h1>Birr Watch</h1>
            <p>Track ETB exchange rates and convert your money.</p>
            <div id="status" class="status">
                Loading rates...
            </div>

            <div id="quick-rates" class="quick-rates"></div>
        </header>

        <section class="card">
            <h2>Currency Converter</h2>

            <form id="convert-form">
                <div class="form-group">
                    <label for="amount">Amount in ETB</label>
                    <input type="number" id="amount" placeholder="Enter amount" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="currency">Convert to</label>
                    <select id="currency">

                    </select>
                </div>

                <button type="submit">Convert</button>
            </form>

            <div id="result" class="result"></div>
        </section>

        <section class="card">
            <div class="section-header">
                <div>
                    <h2>My Watchlist</h2>
                    <p>Keep track of currencies you care about.</p>
                </div>

                <button id="refresh-btn" class="secondary-btn">
                    Refresh Rates
                </button>
            </div>

            <div id="watchlist" class="watchlist">
                <p class="empty">Your watchlist is empty.</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
